[package]
name = "modelpipe-ffi"
version = "0.4.0"
edition = "2024"
# The honest floor, inherited from the crate this binds: the iroh stack
# declares rust-version 1.91, and nothing here can promise a build modelpipe
# cannot deliver.
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/mmogr/modelpipe-ffi"
authors = ["mmogr"]
description = "Swift bindings for modelpipe - reach your local model server from an Apple device"
readme = "README.md"

# Never goes to crates.io. This crate is an Apple-platform build artifact
# whose output is an XCFramework attached to a GitHub release; a source tarball
# on a registry would be a download nobody can use.
#
# A registry allow-list naming no registry that exists, rather than `false`,
# and the difference is load-bearing. `cargo publish` refuses either way: with
# this list it stops before uploading anything, because no `nowhere` registry
# is configured anywhere. But release-plz's `release` command considers only
# packages whose manifest says they can be published somewhere; `publish =
# false` hid this crate from it, so merging a release PR never pushed the
# build tag the comments promised: every tag up to `build/v0.1.4` was pushed
# by hand, and `build/v0.2.0` is too, since its merge commit carries the old
# manifest (#21). The `publish = false` in release-plz.toml is what stops
# release-plz from running `cargo publish`; this line only lets it see the
# crate. Never configure a registry by this name: cargo selects the only
# allowed registry by itself, so a `[registries.nowhere]` entry would make a
# bare `cargo publish` real.
publish = ["nowhere"]

[lib]
name = "modelpipe_ffi"
# staticlib is what Xcode links; cdylib is what `uniffi-bindgen` loads to read
# the scaffolding out of; lib (rlib) is what this crate's own tests link. Drop
# the last one and `cargo test` cannot see its own crate.
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
# The generator, run by `make swift`. UniFFI's documented shape: a bin in the
# crate being bound, so the generated Swift is always read out of the exact
# scaffolding this build produced rather than a separately-versioned tool.
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
# The whole point. This floor used to go *ahead* of the serving side on
# purpose: the crate bound a pairing layer gglib did not yet serve. That is
# over. gglib runs both halves out of one crate, `gglib-app-services`, and
# that crate is on this same release — so the two are level, and the reason
# to name a version here is no longer "reach further" than the desktop but
# "answer the same way it does". (No gglib version is named on purpose: what
# makes the sides level is which modelpipe it pins, and a version number here
# is exactly what rotted in the sentence this replaces.)
#
# Spelled in full because a candidate had to be. While 0.7.0-rc.1 was the only
# 0.7 published, `"0.7"` was a resolution error rather than a loose match:
# cargo will not take a pre-release behind a plain caret. Now that 0.7.0 is
# out, `"0.7"` would resolve — the line is simply not worth a second edit,
# because this caret already accepts 0.7.0, any later candidate of it, and
# every 0.7.x release after it. (Not another patch's candidates: a
# pre-release only satisfies a comparator whose major, minor and patch match
# its own, so 0.7.1-rc.1 is out.)
#
# The lock is what the XCFramework is built from, so moving to 0.7.0 final was
# a deliberate `cargo update -p modelpipe` and never a side effect, and it had
# to happen before a release: a candidate must not be statically linked into
# something that ships to a phone. Done — the lock has resolved 0.7.0 since
# the commit whose subject says so. What is below is the floor of the range,
# not what is resolved.
modelpipe = "0.7.0-rc.1"
uniffi = { version = "0.32", features = ["tokio", "cli"] }
# Multi-thread, because modelpipe's futures are all Send (its own
# `future_promises` pins that) and the pipe should not stall on one worker.
tokio = { version = "1", features = ["rt-multi-thread"] }
# For the watch's cancellation token: stored state, so a cancel that lands
# between a check and a wait registration is never lost. Already in the
# lock, pulled in underneath modelpipe by iroh.
tokio-util = "0.7"
# SHA-256, for the name of the file a device keeps its endpoint key in. That
# name is a contract with ggchat, which computes the same one in Swift, so the
# hash has to be this one and not whatever else is already in the graph.
# Already in the lock underneath iroh via ed25519-dalek, so this names it
# rather than adding it.
#
# No default features. `oid` is on by default and turns on `digest/oid`, which
# would add a `const-oid` edge and an OID table to a static library that ships
# to a phone. `Digest::digest` is behind neither that nor `alloc`.
sha2 = { version = "0.11", default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[lints.rust]
# Denied, exactly as modelpipe denies it. The FFI boundary needs `unsafe`,
# but only inside UniFFI's macro expansion — so the exception is granted at
# the one item that expands to it (`setup_scaffolding!` in lib.rs) rather
# than to the crate. Every hand-written line in src/ is checked, which is the
# whole point: "this crate needs unsafe" is true of six generated lines and
# false of everything a human wrote here.
unsafe_code = "deny"
missing_docs = "deny"
unreachable_pub = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Same allow modelpipe carries, for the same reason: `pub(crate)` inside a
# private module states the intended reach at the item, which survives the
# module later becoming public. The lint would have us drop the marker and
# rely on the module's privacy alone.
redundant_pub_crate = "allow"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 16
