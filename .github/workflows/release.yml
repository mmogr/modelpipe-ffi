# Build the XCFramework, pin its checksum, and create the release tag.
#
# THE TAG THIS RUNS ON IS NOT THE RELEASE TAG. release-plz pushes
# `build/vX.Y.Z` when the release PR merges; this workflow builds the artifact,
# writes its checksum into Package.swift on main, and only then creates the
# public `vX.Y.Z` tag on that commit.
#
# The ordering is the whole design. SwiftPM loads Package.swift from the file
# view at the tag it resolves, so a tag naming a commit whose checksum is stale
# or absent is a package nobody can build. Package.swift is not an input to the
# artifact — `build-xcframework.sh` never opens a manifest and the zip holds
# only the XCFramework — so there is no chicken and egg here, just an order:
# build, pin, tag. `build/vX.Y.Z` is invisible to SwiftPM, whose `Version(tag:)`
# strips at most one leading `v` and cannot parse it, so it never appears as a
# package version.
#
# Nothing here publishes to crates.io. The crate carries `publish = false` and
# always will: it is an Apple-platform build artifact, and a source tarball on
# a registry would be a download nobody can use. The release *asset* is the
# product, and its checksum is what the consuming app pins.
name: Release

on:
  push:
    tags:
      - "build/v[0-9]+.[0-9]+.[0-9]+"
      - "build/v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and check, but create no release"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    outputs:
      already_released: ${{ steps.existing.outputs.already_released }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # A tag on a branch that never merged is a release of code nobody
      # reviewed. Cheap to check, and the check is the whole point of tagging
      # from main.
      - name: Refuse a tag that is not on main
        if: github.event_name == 'push'
        run: |
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${GITHUB_REF_NAME} is not an ancestor of main"
            exit 1
          fi
          echo "tag is on main"

      # A build tag whose release already exists must not rebuild anything.
      #
      # The build is not byte-reproducible, so a second run would compute a
      # DIFFERENT checksum for the same version, pin that onto main, and only
      # then discover the release was already there — leaving main naming a
      # published zip with a checksum that matches nothing. SwiftPM refuses a
      # version whose checksum changed anyway (it reads it as a security
      # risk), so there is no recovering it in place either.
      #
      # This is also what makes `build/v0.1.0` safe to create as the baseline
      # release-plz needs in its own tag namespace: the tag fires this
      # workflow, and this stops it here.
      - name: Stop if this version is already released
        id: existing
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#build/v}"
          if gh release view "v${version}" >/dev/null 2>&1; then
            echo "already_released=true" >> "${GITHUB_OUTPUT}"
            echo "::notice::v${version} is already released; nothing to do."
          else
            echo "already_released=false" >> "${GITHUB_OUTPUT}"
            echo "v${version} is not released yet"
          fi

      - name: Install Rust toolchain
        run: rustup show

      # Publishing a release is irreversible; a grep is not. Same step
      # modelpipe carries, with this crate's own src path.
      - name: Refuse to release unimplemented code
        run: |
          if grep -rn --include='*.rs' -E '\b(todo!|unimplemented!)\(' src; then
            echo "::error::the tree above still has unimplemented bodies"
            exit 1
          fi
          echo "no unimplemented bodies"

      - name: Architecture gates
        run: make enforce

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Lockfile guard
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo test --locked --no-fail-fast

      - name: The smoke test exercises every exported member
        run: make surface binding-check

      - name: Docs
        run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

      # The tag says a version; the manifest says a version. A release where
      # they disagree is one nobody can later identify from the artifact.
      - name: Tag matches the manifest
        if: github.event_name == 'push'
        run: |
          manifest="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          tag="${GITHUB_REF_NAME#build/v}"
          if [[ "${manifest}" != "${tag}" ]]; then
            echo "::error::tag ${tag} but Cargo.toml says ${manifest}"
            exit 1
          fi
          echo "tag and manifest agree on ${manifest}"

  build:
    name: Build the XCFramework
    runs-on: macos-26
    needs: [verify]
    if: needs.verify.outputs.already_released != 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `main` is fetched below to commit the checksum onto it.
          fetch-depth: 0
          # The push uses RELEASE_PAT explicitly rather than whatever the
          # checkout left in .git/config.
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Builds every slice and asserts each one is the platform it claims.
      - name: Build
        run: make xcframework

      # Proves the artifact about to be released actually links and answers,
      # rather than merely having been produced.
      - name: Swift links and calls it
        run: ./scripts/swift-smoke.sh

      - name: Zip and checksum
        id: package
        run: |
          # The slice list is read off the framework rather than typed. The
          # typed one drifted the moment the Intel targets were dropped: the
          # notes went on naming `ios-arm64_x86_64-simulator` for a bundle
          # that no longer existed, so the release described an artifact that
          # was not the one attached. A list derived from the thing it
          # describes cannot fall out of step with it.
          slices=""
          for dir in build/ModelpipeFFI.xcframework/*/; do
            slices="${slices}\`$(basename "${dir}")\`, "
          done
          echo "slices=${slices%, }" >> "${GITHUB_OUTPUT}"

          cd build
          zip -qry ModelpipeFFI.xcframework.zip ModelpipeFFI.xcframework
          checksum="$(swift package compute-checksum ModelpipeFFI.xcframework.zip)"
          echo "checksum=${checksum}" >> "${GITHUB_OUTPUT}"
          echo "The consuming app pins this: ${checksum}"

      - name: Upload the artifact
        uses: actions/upload-artifact@v7
        with:
          name: ModelpipeFFI.xcframework.zip
          path: build/ModelpipeFFI.xcframework.zip
          retention-days: 14

      # Everything from here is the ordering the header describes: pin the
      # checksum onto main, create the tag on that commit, then prove a
      # consumer can actually resolve what was just published.
      - name: Pin the checksum on main
        if: github.event_name == 'push'
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
        run: |
          version="${GITHUB_REF_NAME#build/v}"
          git fetch origin main
          # `build/` is gitignored, so the artifact and its zip survive this.
          git checkout -B main origin/main

          # Two dedicated `let` lines that exist only to be rewritten. A sed
          # against a manifest is fragile when it has to match a line that is
          # also doing something else; these do nothing else.
          sed -i '' -E "s|^let version = \".*\"$|let version = \"${version}\"|" Package.swift
          sed -i '' -E "s|^let checksum = \".*\"$|let checksum = \"${CHECKSUM}\"|" Package.swift

          # A silent no-op here would publish a tag whose manifest names the
          # PREVIOUS release's zip while the binding beside it is this one's —
          # mismatched halves, which UniFFI turns into a fatalError on a device
          # at the first dial rather than an error at build time. So the
          # substitution has to have changed something.
          if git diff --quiet -- Package.swift; then
            echo "::error::the checksum substitution matched nothing in Package.swift"
            echo "::error::expected lines: let version = \"...\" and let checksum = \"...\""
            exit 1
          fi
          git diff -- Package.swift

          # Authored as the repository owner, matching every other commit here.
          # The apostrophe needs no escaping: this is already inside double
          # quotes, where a single quote is an ordinary character. Reaching for
          # the '"'"' idiom here — which belongs inside SINGLE quotes — left an
          # unbalanced quote, and the whole step died on a syntax error after
          # the build, the smoke test and the checksum had all succeeded.
          git -c user.name="Matt O'Grady" \
              -c user.email="sewing.wader8c@icloud.com" \
              commit -qm "chore(release): pin the v${version} XCFramework checksum" \
              -- Package.swift
          # The secret is masked in the log. This runs before the release is
          # created on purpose: if the push is refused, no tag and no release
          # exist yet and no version has been burned.
          git push "https://x-access-token:${RELEASE_PAT}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main

      # The tag is created HERE, from the commit that carries its own checksum,
      # which is why `--verify-tag` is absent: `gh` creates it from `--target`,
      # and that is the mechanism rather than an oversight.
      - name: Create the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          SLICES: ${{ steps.package.outputs.slices }}
        run: |
          version="${GITHUB_REF_NAME#build/v}"
          notes="$(mktemp)"
          {
            echo "## Consuming this release"
            echo
            echo '```swift'
            echo ".package(url: \"https://github.com/${GITHUB_REPOSITORY}.git\", from: \"${version}\")"
            echo '```'
            echo
            echo "Then \`import Modelpipe\`. The seven system frameworks the static"
            echo "library needs are declared on the package's own target, so there is"
            echo "nothing else to add."
            echo
            echo "Slices: ${SLICES}."
            echo "Each was checked to carry the platform load command it claims,"
            echo "and to be Apple silicon only."
            echo
            echo "---"
            echo
          } > "${notes}"

          gh release create "v${version}" \
            build/ModelpipeFFI.xcframework.zip \
            --target "$(git rev-parse HEAD)" \
            --title "v${version}" \
            --notes-file "${notes}" \
            --generate-notes

      # The one step that executes the entire release claim at once: the tag
      # exists, its manifest names the zip that was just uploaded, the checksum
      # matches, the binding compiles against it, and all seven linker settings
      # reach a consumer that declares none. `swift package resolve` is what
      # performs the download and the checksum verification; a `.dynamic`
      # product is what forces a final link.
      #
      # Everything upstream tests the repository. This tests the release.
      - name: A consumer can actually resolve it
        if: github.event_name == 'push'
        run: |
          version="${GITHUB_REF_NAME#build/v}"
          gate="$(mktemp -d)"
          mkdir -p "${gate}/Sources/ResolveGate"

          cat > "${gate}/Package.swift" <<SWIFT
          // swift-tools-version: 6.2
          import PackageDescription

          let package = Package(
              name: "ResolveGate",
              platforms: [.macOS(.v26)],
              products: [
                  .library(name: "ResolveGate", type: .dynamic, targets: ["ResolveGate"])
              ],
              dependencies: [
                  .package(url: "https://github.com/${GITHUB_REPOSITORY}.git", exact: "${version}")
              ],
              targets: [
                  .target(
                      name: "ResolveGate",
                      dependencies: [.product(name: "Modelpipe", package: "modelpipe-ffi")]
                  )
              ],
              swiftLanguageModes: [.v6]
          )
          SWIFT

          cat > "${gate}/Sources/ResolveGate/Gate.swift" <<'SWIFT'
          import Modelpipe

          // Never called. It exists so the linker has to resolve the symbols a
          // real consumer would reach for.
          public func gate() async throws -> String {
              let pipe = try await mpConnect(ticket: "nope", options: MpConnectOptions())
              return pipe.baseUrl()
          }
          SWIFT

          cd "${gate}"
          swift build
          echo "a consumer resolved v${version}, downloaded the artifact, and linked it"
