# release-plz (https://release-plz.dev): on every push to main it maintains a
# release PR — version bump plus CHANGELOG.md — and when that PR merges it
# pushes the vX.Y.Z tag. It never publishes anything: release-plz.toml sets
# publish = false, so the tag is where its job ends and release.yml (verify →
# build the XCFramework → attach it with its checksum) takes over.
#
# Both jobs authenticate with RELEASE_PAT — a fine-grained PAT (this repo
# only; Contents and Pull requests, read/write) — rather than the default
# GITHUB_TOKEN, because events created with the default token trigger no
# workflows. That would cost both halves: the release PR would get no CI and
# so could never satisfy the required check, and the pushed tag would never
# start release.yml, leaving a tag with no framework behind it.
#
# What merging the release PR pushes is `build/vX.Y.Z`, NOT the release tag.
# release-plz cannot own the public tag, because the commit that tag must name
# has to carry the XCFramework's checksum, and that does not exist until the
# artifact is built. So `release.yml` builds, pins the checksum onto main, and
# creates `vX.Y.Z` there. See release-plz.toml for the full reasoning.

name: Release-plz

on:
  push:
    branches: [main]

jobs:
  # Pushes the vX.Y.Z tag when a release PR merges. A no-op on every other
  # push (release_always = false in release-plz.toml).
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    # Forks have no business releasing, and no RELEASE_PAT to do it with.
    if: github.repository_owner == 'mmogr'
    permissions:
      # Push the tag.
      contents: write
      # Detect the merged release PR.
      pull-requests: read
    # No concurrency group here on purpose, per upstream docs: a cancelled
    # in-progress run could skip a release.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: release-plz releases from the release-PR commit.
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup show

      - name: Run release-plz release
        uses: release-plz/action@aec534bbd8631793b9b3b8f1ee6cd886c322e17f # v0.5.133
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}

  # Opens or updates the release PR (version bump + changelog).
  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    if: github.repository_owner == 'mmogr'
    permissions:
      # Push to the PR branch.
      contents: write
      # Create and update the PR.
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup show

      - name: Run release-plz release-pr
        uses: release-plz/action@aec534bbd8631793b9b3b8f1ee6cd886c322e17f # v0.5.133
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
