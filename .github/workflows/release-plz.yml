# release-plz (https://release-plz.dev): on every push to main it maintains a
# release PR — version bump plus CHANGELOG.md — and when that PR merges it
# pushes the `build/vX.Y.Z` tag. It never publishes anything: release-plz.toml
# sets publish = false, so the tag is where its job ends and release.yml
# (verify → build the XCFramework → attach it with its checksum) takes over.
#
# The tag step depends on Cargo.toml's `publish` being a registry list rather
# than `false`: `release-plz release` skips a package whose manifest says it
# can be published nowhere, and did so on every release-PR merge up to 0.2.0,
# logging "nothing to release" (#21).
#
# Both jobs authenticate with RELEASE_PAT — a fine-grained PAT (this repo
# only; Contents and Pull requests, read/write) — rather than the default
# GITHUB_TOKEN, because events created with the default token trigger no
# workflows. That would cost both halves: the release PR would get no CI and
# so could never satisfy the required check, and the pushed tag would never
# start release.yml, leaving a tag with no framework behind it.
#
# What merging the release PR pushes is `build/vX.Y.Z`, NOT the release tag.
# release-plz cannot own the public tag, because the commit that tag must name
# has to carry the XCFramework's checksum, and that does not exist until the
# artifact is built. So `release.yml` builds, pins the checksum onto main, and
# creates `vX.Y.Z` there. See release-plz.toml for the full reasoning.

name: Release-plz

on:
  push:
    branches: [main]
  # For the tag check below alone. A merge whose push event never fires runs
  # nothing on that commit, so only a schedule can notice it on a quiet repo.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  # Pushes the build/vX.Y.Z tag when a release PR merges. A no-op on every other
  # push (release_always = false in release-plz.toml).
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-26.04
    # A stall guard: release-plz installs from a binary and reads git; the
    # default is six hours.
    timeout-minutes: 15
    # Forks have no business releasing, and no RELEASE_PAT to do it with. On a
    # push only: the schedule and a dispatch are for the tag check.
    if: github.repository_owner == 'mmogr' && github.event_name == 'push'
    permissions:
      # Push the tag.
      contents: write
      # Detect the merged release PR.
      pull-requests: read
    # No concurrency group here on purpose, per upstream docs: a cancelled
    # in-progress run could skip a release.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: release-plz releases from the release-PR commit.
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup show

      - name: Run release-plz release
        uses: release-plz/action@f67a7e724bdad4a0f6875f186060a0ca2770d76c # v0.5.147
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}

  # Opens or updates the release PR (version bump + changelog).
  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-26.04
    # A stall guard: release-plz installs from a binary and reads git; the
    # default is six hours.
    timeout-minutes: 15
    if: github.repository_owner == 'mmogr' && github.event_name == 'push'
    permissions:
      # Push to the PR branch.
      contents: write
      # Create and update the PR.
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup show

      - name: Run release-plz release-pr
        uses: release-plz/action@f67a7e724bdad4a0f6875f186060a0ca2770d76c # v0.5.147
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}

  # The version on main has a build tag. Merging a release PR sets the version
  # and the release job above tags it; if the push event for that merge never
  # fires, nothing runs on the commit, the tag is never pushed, and nothing
  # says so. release-plz then reads the version as already set and the
  # changelog as up to date, so it opens no release PR either: v0.4.3 sat that
  # way from 2026-10-02 until 2026-11-10, with every run green.
  #
  # After the release job, so a merge it has just tagged reads as tagged.
  release-tagged:
    name: The version on main is tagged
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    needs: [release-plz-release]
    if: >-
      !cancelled() && github.repository_owner == 'mmogr'
      && needs.release-plz-release.result != 'failure'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every tag, and main as it is now, not as the event saw it.
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Fail if the manifest's version has no build tag
        run: |
          version="$(awk -F'"' '/^\[package\]/ {p = 1; next} /^\[/ {p = 0} p && /^version *=/ {print $2; exit}' Cargo.toml)"
          if [[ -z "${version}" ]]; then
            echo "::error::could not read the package version from Cargo.toml"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/build/v${version}" >/dev/null; then
            echo "build/v${version} exists"
            exit 0
          fi
          echo "::error::Cargo.toml on main says ${version}, and there is no build/v${version} tag: the release PR that set it merged and was never tagged, so nothing was built and release-plz will open no new release PR"
          echo "::error::README.md, Releasing, 'If a release PR merged and no build tag appeared', says what to do"
          exit 1
