# Adapted from modelpipe's ci.yml, plus the Apple half that workspace has no
# infrastructure for. modelpipe's `matrix.target` values are labels used for
# job names and cache keys; the cargo commands there never pass `--target`.
# Here they do, because producing Apple objects is the entire point.
#
# The enforcement scripts live in the `fmt` job because none of them needs a
# toolchain: they count lines and grep for shapes.
#
# No `apt-get install` step anywhere below: iroh resolves rustls onto `ring`,
# which needs no system libraries. If a future dependency flips the graph to
# `aws-lc-sys`, these jobs start needing cmake and a C toolchain — the lockfile
# is where that change is visible.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on a branch, never on main: a cancelled run on main
# is a lost integration signal, which is exactly the defect ggchat spent #44
# fixing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Read-only across the board: nothing in CI writes to the repo, and the
# checkout credential this scopes down is otherwise sitting in .git/config for
# the whole build — including every build script cargo runs.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: rustup show

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workflow YAML for duplicate keys
        run: ./scripts/check_workflow_yaml.sh

      - name: Check file sizes
        run: ./scripts/check_file_size.sh

      # The design property this crate is most able to lose by accident, and
      # the one whose loss is least visible in review.
      - name: No credential crosses the boundary
        run: ./scripts/check_no_credentials.sh

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Lockfile guard
        run: cargo metadata --locked --format-version 1 > /dev/null

      # The suite binds real loopback sockets and dials a ticket that names a
      # machine which does not exist. It reaches no relay and no discovery
      # service: every test passes `discovery: false, port_mapping: false`, so
      # a runner with no outbound network still runs the whole thing.
      - name: Test
        run: cargo test --no-fail-fast

      # Runs here rather than in the Apple job on purpose. The scaffolding
      # describes the API, not the machine, so the binding generates from the
      # host library on Linux in seconds -- and the question it answers ("is
      # anything exported that CI never calls?") does not need a Mac to ask.
      - name: The smoke test exercises every exported member
        run: make surface binding-check

  rustdoc:
    name: Rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Public docs
        run: cargo doc --no-deps

      - name: Private docs
        run: cargo doc --no-deps --document-private-items

  apple:
    name: Apple build and Swift smoke
    runs-on: macos-26
    # The smoke test's whole subject is a call that HANGS rather than errors —
    # an async method whose runtime was never started. Without a ceiling here,
    # detecting that would mean a job running to GitHub's six-hour default on a
    # runner billed at ten times the Linux rate. A cold three-slice build plus
    # the Swift package is comfortably under twenty; thirty leaves room for a
    # slow runner without leaving room for a hang.
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Builds every slice, generates the Swift, assembles the framework, and
      # asserts each slice carries the platform load command and deployment
      # floor it claims. That last part is the one that matters: a
      # cross-compile which silently produced host objects succeeds everywhere
      # else and fails at link time in the consuming app, days later.
      #
      # Unoptimised on purpose. This job answers "does it cross-compile,
      # assemble, link and answer" — none of which optimisation changes — and
      # five release builds of iroh with thin LTO on a runner billed at ten
      # times the Linux rate is not a per-commit cost worth paying. It also
      # catches strictly more: the iOS deployment-target bug was invisible in
      # release, where optimisation drops the NEON path that referenced the
      # missing symbol.
      - name: Build the XCFramework
        run: make xcframework-fast

      # Same job as the build, deliberately.
      #
      # This was two jobs passing a 622 MB artifact between them, which bought
      # nothing: the smoke test needs the framework AND the generated Swift
      # beside it, both are outputs of the step above, and `needs:` meant it
      # could never run without that step anyway. One job, no upload, no
      # download, and no way for the two halves to disagree about which build
      # they are testing.
      #
      # WHAT THIS PROVES: the generated Swift compiles under the same
      # strict-concurrency settings the app uses, the static library links,
      # every symbol resolves, and a call across the boundary returns —
      # including an async one, which is where a runtime that was never
      # started shows up as a hang rather than an error.
      #
      # WHAT IT DOES NOT PROVE: anything about a network. No hole punching, no
      # NAT traversal, no relay, no phone. A runner is not a device behind
      # CGNAT. That measurement is the on-device spike, and a green run here
      # is not a substitute for it.
      - name: Swift links and calls it
        run: ./scripts/swift-smoke.sh

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    # The single required status check. Adding a job above needs only a line
    # here — no branch-protection change.
    needs: [fmt, clippy, test, rustdoc, apple]
    if: always()
    steps:
      - name: Fail if anything upstream failed
        run: |
          if echo '${{ toJSON(needs) }}' | grep -q '"result": *"failure"'; then
            echo "::error::a required job failed"
            exit 1
          fi
          if echo '${{ toJSON(needs) }}' | grep -q '"result": *"cancelled"'; then
            echo "::error::a required job was cancelled"
            exit 1
          fi
          echo "all required jobs succeeded"
